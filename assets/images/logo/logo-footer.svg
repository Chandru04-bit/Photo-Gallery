<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="goldGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4E3"/>
      <stop offset="35%" stop-color="#DFBA6D"/>
      <stop offset="70%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9C7728"/>
    </linearGradient>
    <linearGradient id="maroonGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1A32"/>
      <stop offset="100%" stop-color="#400A18"/>
    </linearGradient>
    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emblem / Mandap Arch & Kalash Icon (Exact Same Crest as Primary Logo) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#maroonGradF)" filter="url(#shadowF)"/>
    <rect x="2" y="2" width="52" height="52" rx="12" fill="none" stroke="url(#goldGradF)" stroke-width="1.6" stroke-opacity="0.95"/>
    
    <!-- Royal Mandap Dome / Canopy Silhouette -->
    <path d="M28 8 C30 14, 44 20, 44 32 C44 42, 38 46, 28 46 C18 46, 12 42, 12 32 C12 20, 26 14, 28 8 Z" fill="none" stroke="url(#goldGradF)" stroke-width="1.8"/>
    
    <!-- Inner Festive Kalash & Coconut / Flame motif -->
    <path d="M28 15 L32 23 L24 23 Z" fill="url(#goldGradF)"/>
    <circle cx="28" cy="12" r="2" fill="url(#goldGradF)"/>
    
    <!-- Traditional Pillars -->
    <line x1="20" y1="26" x2="20" y2="44" stroke="url(#goldGradF)" stroke-width="1.5"/>
    <line x1="36" y1="26" x2="36" y2="44" stroke="url(#goldGradF)" stroke-width="1.5"/>
    <path d="M16 44 L40 44" stroke="url(#goldGradF)" stroke-width="2"/>
    <path d="M22 28 Q28 22 34 28" fill="none" stroke="url(#goldGradF)" stroke-width="1.5"/>
    <circle cx="28" cy="35" r="2.5" fill="url(#goldGradF)"/>
  </g>

  <!-- Typography for Dark Maroon Footer: High Contrast, 100% Transparent Background -->
  <text x="72" y="32" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="2.5">UTSAV</text>
  <text x="180" y="24" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" fill="#DFBA6D" letter-spacing="1">DECOR</text>
  
  <text x="72" y="47" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#EDE4DE" letter-spacing="1.8">STAGE • TENT • PANDAL</text>
  <text x="72" y="56" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="500" fill="#DFBA6D" letter-spacing="1.2">PREMIUM EVENT CONTRACTORS</text>
</svg>
